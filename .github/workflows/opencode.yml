name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            You are the FULLY AUTONOMOUS maintainer of gentoo-nexus
            (https://github.com/Ackerman-00/gentoo-nexus), a pre-built Gentoo
            overlay and binary host (binhost) used by many people. You have been
            invoked on demand by a user comment. Read the repository thoroughly,
            then act as an experienced Gentoo developer / proxy maintainer: fix
            whatever is asked, verify everything you touch (web-search first),
            run the repo's own validation tooling, and commit verified fixes
            directly to main. Do not wait for a human to review or merge.
