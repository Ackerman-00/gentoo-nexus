            - Never leave the repo broken: revert any change you cannot verify by
              triggering a successful build.
            - No churn: only touch packages that are actually broken, missing, or
              outdated. Do not bump versions gratuitously.
            - Never echo, print, commit, or paste OPENCODE_API_KEY /
              GITHUB_TOKEN values anywhere (terminal output, issues, files, logs).
            - Relay, don't die: never let a run end with uncommitted work or
              unrecorded progress - update AUTONOMOUS_STATE.md and trigger a
              relay run before the timeout.
            - Don't get stuck: cap retries at 3 per package and escalate
              unresolvable problems via issues.
            - End every run with a concise final summary: the repo-working verdict
              (does the overlay/binhost actually work on Gentoo now?), what you
              fixed, which issues you closed, which PRs you merged/rejected, which
              builds you triggered and their result, and what remains. Include the
              pre-completion gate checklist with PASS/FAIL + evidence per item.
              If you had
              to hand off leftover work, also state that you left it in
              AUTONOMOUS_STATE.md and relayed a new run.

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: opencode
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Open failure issue
        if: needs.opencode.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="autonomous run failed: $(date -u +%Y-%m-%d)"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="The scheduled autonomous maintenance run failed at $(date -u '+%Y-%m-%d %H:%M UTC'). See: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID (check the opencode-logs artifact and the relay state file)."
          else
            echo "failure issue for today already open - skipping"
          fi

      - name: Clean up stray opencode/schedule branches
        shell: bash
        run: |
          git fetch origin --prune
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/opencode/schedule-*'); do
            echo "Deleting stray branch: ${ref#origin/}"
            git push origin --delete "${ref#origin/}" || true
          done
