name: Build Relay

on:
  workflow_dispatch:
    inputs:
      package_list:
        description: 'Space-separated package atoms to compile'
        required: true
      force_rebuild:
        description: 'Packages to force rebuild (or "true" for all)'
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      remaining: ${{ steps.queue.outputs.REMAINING_PKGS }}
      force_rebuild: ${{ github.event.inputs.force_rebuild }}
    steps:

      # ---- topic: environment-setup ----
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Allocate ZRAM Swap
        run: |
          sudo modprobe zram 2>/dev/null || { echo "ZRAM not available, skipping"; free -h; exit 0; }
          sudo zramctl --find --size 12G --algorithm lz4
          sudo mkswap /dev/zram0
          sudo swapon /dev/zram0 --priority 100
          free -h

      - name: Free Disk Space for Docker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # ---- topic: ccache ----
      - name: Persistent CCache Setup
        uses: actions/cache@v6.1.0
        with:
          path: ccache
          key: gentoo-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gentoo-ccache-${{ runner.os }}-

      # ---- topic: workspace-overlay ----
      - name: Prepare Workspace & Overlay
        run: |
          mkdir -p binpkgs overlay/metadata overlay/profiles distfiles ccache
          chmod -R 777 binpkgs overlay distfiles ccache
          rsync -a --exclude='.git' --exclude='binpkgs' --exclude='overlay' ./ overlay/
          printf 'masters = gentoo\nthin-manifests = true\nsign-manifests = false\nmanifest-required-hashes = BLAKE2B SHA512\nmanifest-hashes = BLAKE2B SHA512\ncache-formats = md5-dict\nprofile-formats = portage-2\n' > overlay/metadata/layout.conf
          echo "gentoo-nexus" > overlay/profiles/repo_name

      - name: Download Release Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> Downloading existing .gpkg.tar and Packages from rolling release..."
          gh release download rolling \
            -p "*.gpkg.tar" -p "Packages*" \
            --repo ${{ github.repository }} \
            --dir binpkgs --clobber 2>/dev/null || true

          for f in binpkgs/*.gpkg.tar; do
            [ -e "$f" ] || continue
            if ! tar -tf "$f" >/dev/null 2>&1; then
              rm -f "$f"
            fi
          done

      - name: Restore GPKG Layout using gpkg CATEGORY metadata
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/binpkgs:/var/cache/binpkgs:rw" \
            -v "${{ github.workspace }}:/var/db/repos/gentoo-nexus:ro" \
            gentoo/stage3:amd64-desktop-openrc \
            sh -c "
          python3 -m pip install --quiet zstandard 2>/dev/null || true
          python3 -c '
          import os, shutil, io, tarfile

          pkgdir = \"/var/cache/binpkgs\"

          HAVE_ZSTD = False
          try:
              import zstandard
              HAVE_ZSTD = True
          except ImportError:
              pass

          def _decompress(data):
              if HAVE_ZSTD:
                  return zstandard.ZstdDecompressor().decompressobj().decompress(data)
              import subprocess as sp
              tf = \"/tmp/meta.zst\"
              with open(tf, \"wb\") as o:
                  o.write(data)
              raw = sp.check_output([\"zstd\", \"-d\", \"-c\", tf])
              os.unlink(tf)
              return raw

          def gpkg_category(path):
              # Authoritative category comes from the gpkg'\''s own metadata/CATEGORY
              # file (GLEP 78). Guessing from a pn->cat map mis-categorizes packages
              # (json->dev-haskell, git->dev-ruby) so emaint indexes wrong paths.
              try:
                  with open(path, \"rb\") as fh:
                      with tarfile.open(fileobj=fh, mode=\"r|\") as tar:
                          for m in tar:
                              if m.name.endswith((\".tar.zst\", \".tar.gz\", \".tar.bz2\")) and \"metadata\" in m.name:
                                  raw = _decompress(tar.extractfile(m).read())
                                  with tarfile.open(fileobj=io.BytesIO(raw)) as mt:
                                      for mm in mt.getmembers():
                                          if mm.name == \"metadata/CATEGORY\":
                                              return mt.extractfile(mm).read().decode(\"utf-8\", \"replace\").strip()
              except Exception as e:
                  print(f\"  WARN: cannot read CATEGORY from {path}: {e}\")
              return None

          moved = 0
          for f in sorted(os.listdir(pkgdir)):
              if not f.endswith(\".gpkg.tar\"):
                  continue
              path = os.path.join(pkgdir, f)
              cat = gpkg_category(path)
              if not cat:
                  print(f\"  SKIP (no CATEGORY): {f}\")
                  continue
              target_dir = os.path.join(pkgdir, cat)
              target_path = os.path.join(target_dir, f)
              if path != target_path:
                  os.makedirs(target_dir, exist_ok=True)
                  shutil.move(path, target_path)
                  moved += 1
          print(f\">>> Restored layout: {moved} file(s) placed under gpkg CATEGORY dirs\")
          '
          "

      - name: Fix Workspace Permissions
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      # ---- topic: queue-and-build-script ----
      - name: Parse Queue & Normalize Targets
        id: queue
        run: |
          raw_input="${{ github.event.inputs.package_list }}"
          read -r -a RAW_PKGS <<< "$raw_input"

          normalize_target() {
            local t="$1"
            if [[ "$t" == https://gitweb.gentoo.org/*/tree/* ]]; then
              echo "$t" | sed -E 's|.*/tree/([^/]+)/([^/]+)/\2-([^/]+)\.ebuild$|=\1/\2-\3|'
              return
            fi
            if [[ "$t" == =* ]]; then echo "$t"; return; fi
            if echo "$t" | grep -qE '^[a-z][a-z0-9_+-]+/[a-zA-Z0-9_+.-]+-[0-9]'; then
              echo "=${t}"; return
            fi
            echo "$t"
          }

          NORMALIZED=()
          for raw in "${RAW_PKGS[@]}"; do
            NORMALIZED+=("$(normalize_target "$raw")")
          done

          TARGET="${NORMALIZED:-}"
          REMAINING="${NORMALIZED[*]:1}"

          echo "TARGET_PKG=$TARGET" >> "$GITHUB_OUTPUT"
          echo "REMAINING_PKGS=$REMAINING" >> "$GITHUB_OUTPUT"

          if [ -z "$TARGET" ]; then
            echo "skip_compile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CPV="${TARGET#=}"
          echo "CPV=[${CPV}]"

          if [[ "$CPV" == *"-9999" ]] || [[ "$TARGET" != =* ]]; then
            echo ">>> Live ebuild or unversioned — skip_compile=false"
            echo "skip_compile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FORCE="${{ github.event.inputs.force_rebuild }}"
          echo "FORCE=[${FORCE}]"
          if [[ "$FORCE" == "true" ]]; then
            echo ">>> FORCE=true — skip_compile=false"
            echo "skip_compile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for atom in $FORCE; do
            atom="${atom#=}"
            if [[ "$CPV" == "$atom"* ]]; then
              echo ">>> FORCE atom [${atom}] matches CPV — skip_compile=false"
              echo "skip_compile=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          IN_PACKAGES=false
          if grep -qF "CPV: ${CPV}" binpkgs/Packages 2>/dev/null; then
            IN_PACKAGES=true
            echo ">>> CPV ${CPV} FOUND in binpkgs/Packages"
          else
            echo ">>> CPV ${CPV} NOT found in binpkgs/Packages"
          fi

          PN=$(echo "$CPV" | sed -E 's/-[0-9].*//')
          GPKG_EXISTS=false
          GPKG_PATH=$(find binpkgs -name "${PN}-[0-9]*.gpkg.tar" -print -quit 2>/dev/null || true)
          if [ -n "$GPKG_PATH" ]; then
            GPKG_EXISTS=true
            echo ">>> Found .gpkg.tar: ${GPKG_PATH}"
          else
            echo ">>> No .gpkg.tar found for ${PN}"
          fi

          if [[ "$IN_PACKAGES" == "true" && "$GPKG_EXISTS" == "true" ]]; then
            echo ">>> Both Packages and .gpkg.tar exist — skip_compile=true"
            echo "skip_compile=true" >> "$GITHUB_OUTPUT"
          else
            echo ">>> Package missing (Packages=$IN_PACKAGES, gpkg=$GPKG_EXISTS) — skip_compile=false"
            echo "skip_compile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean Up Corrupt Assets From Rolling Release
        if: steps.queue.outputs.skip_compile != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo ">>> Cleaning corrupt assets from rolling release..."
          if ! gh release view rolling --repo "$REPO" >/dev/null 2>&1; then
            echo "  No rolling release yet — nothing to clean."
            exit 0
          fi

          # Download the current Packages as a size reference for validation
          gh release download rolling -p 'Packages' --repo "$REPO" --clobber -O /tmp/rl-Packages 2>/dev/null || touch /tmp/rl-Packages

          echo "  Scanning existing assets..."
          gh release view rolling --json assets --jq '.[] | .[] | "\(.name)|\(.size)"' --repo "$REPO" 2>/dev/null | while IFS='|' read name size; do
            case "$name" in
              *.gpkg.tar)
                expected=$(grep -B1 "^PATH: ${name}$" /tmp/rl-Packages 2>/dev/null | head -1 | grep -oP '^SIZE: \K\d+' || true)
                if [ -n "$expected" ] && [ "$size" -lt "$((expected * 8 / 10))" ]; then
                  echo "  CORRUPT: $name (remote ${size}B < 80% of expected ${expected}B) — deleting"
                  gh release delete-asset rolling "$name" --repo "$REPO" -y 2>&1 || true
                elif [ "$size" -lt 512 ]; then
                  echo "  CORRUPT: $name (too small: ${size}B) — deleting"
                  gh release delete-asset rolling "$name" --repo "$REPO" -y 2>&1 || true
                else
                  echo "  OK: $name (${size}B)"
                fi
                ;;
              Packages|Packages.gz)
                # Keep the index intact. Deleting it here and then failing the
                # build (before the upload step) leaves the binhost WITHOUT a
                # Packages index, which makes every consumer --getbinpkg 404 and
                # causes cascading build failures. The upload step replaces it.
                echo "  Keeping $name (index regeneration happens at upload)"
                ;;
              commits.json)
                # Keep — will be updated later
                ;;
            esac
          done
          # /tmp/rl-Packages is intentionally kept: the Reconcile step reads it
          # to distinguish restored release binaries from pre-build artifacts.

      - name: Write Monolithic Docker Build Script
        if: steps.queue.outputs.skip_compile != 'true'
        run: |
          cat > build.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -euo pipefail

          RAW_TARGET="$1"
          FORCE="${2:-}"

          echo ">>> Syncing Gentoo ebuild repository..."
          mkdir -p /var/db/repos/gentoo /etc/portage/repos.conf
          emerge-webrsync -q

          eselect profile set default/linux/amd64/23.0/desktop/gnome 2>/dev/null || \
            eselect profile list 2>/dev/null | grep -m1 desktop | awk '{print $1}' | tr -d '[]' | xargs -r eselect profile set || \
            eselect profile set 1

          getuto 2>/dev/null || emerge -q --oneshot app-crypt/gentoo-keys 2>/dev/null || true

          cat > /etc/portage/make.conf << 'MAKECONF'
          COMMON_FLAGS="-O2 -pipe -march=x86-64-v3"
          CFLAGS="${COMMON_FLAGS}"
          CXXFLAGS="${COMMON_FLAGS}"
          FCFLAGS="${COMMON_FLAGS}"
          FFLAGS="${COMMON_FLAGS}"
          VIDEO_CARDS="amdgpu radeonsi"
          CPU_FLAGS_X86="avx avx2 f16c fma3 mmx mmxext popcnt sse sse2 sse3 sse4_1 sse4_2 ssse3"
          # USE flags are inherited from the selected desktop/gnome profile.
          # The official Gentoo x86-64-v3 binhost sets NO custom global USE (only
          # profile defaults + */* CPU_FLAGS_X86), so we match it here for binary
          # compatibility. ffmpeg codec flags are set per-package in package.use below.
          
          FEATURES="getbinpkg buildpkg ccache binpkg-ignore-signature -pkgdir-index-trusted -sandbox -usersandbox -ipc-sandbox -network-sandbox -pid-sandbox"
          CCACHE_DIR="/var/cache/ccache"
          BINPKG_FORMAT="gpkg"
          PKGDIR="/var/cache/binpkgs"
          DISTDIR="/var/cache/distfiles"
          
          ACCEPT_LICENSE="*"
          ACCEPT_KEYWORDS="~amd64"
          ACCEPT_PROPERTIES="*"
          ACCEPT_RESTRICT="*"
          ACCEPT_CHOSTS="x86_64-pc-linux-gnu"
          CONFIG_PROTECT_MASK="/etc"
          EMERGE_DEFAULT_OPTS="--usepkg --getbinpkg --buildpkg --binpkg-respect-use=y --jobs=4 --load-average=4 --keep-going"
          MAKEOPTS="-j4"
          LC_MESSAGES=C.UTF-8
          PORTAGE_BINPKG_TAR_OPTS="--warning=no-unknown-keyword"
          MAKECONF

          cat > /etc/portage/repos.conf/gentoo-nexus.conf << 'REPO'
          [gentoo-nexus]
          location = /var/db/repos/gentoo-nexus
          masters = gentoo
          priority = 9999
          auto-sync = no
          REPO

          echo ">>> Updating Portage to latest version..."
          emaint binhost --fix
          FEATURES="-getbinpkg" emerge --oneshot --usepkg sys-apps/portage
          quickpkg sys-apps/portage 2>/dev/null || true

          echo ">>> Installing ccache..."
          FEATURES="-getbinpkg" emerge --oneshot --usepkg dev-util/ccache 2>/dev/null || true

          echo ">>> Creating dummy kernel config for ebuild kernel-option checks..."
          mkdir -p /usr/src/linux
          cat > /usr/src/linux/.config << 'KCONFIG'
          CONFIG_FB=y
          CONFIG_FB_RADEON=m
          CONFIG_DRM_RADEON_UMS=m
          CONFIG_DRM_RADEON=y
          KCONFIG

          mkdir -p /etc/portage/binrepos.conf
          cat > /etc/portage/binrepos.conf/gentoo-official.conf << 'BINHOST'
          [nexus]
          priority = 10
          sync-uri = https://github.com/Ackerman-00/gentoo-nexus/releases/download/rolling/
          location = /var/cache/binhost/nexus
          verify-signature = false

          [gentoo-official-v3]
          priority = 5
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
          location = /var/cache/binhost/gentoo-official-v3
          verify-signature = true
          BINHOST

          # Portage >=3.0.81 ships a default [gentoo] binrepo at
          # /usr/share/portage/config/binrepos.conf/gentoo.conf with
          # x86-64 paths. Override it here (higher priority dir) to
          # use x86-64-v3 instead of deleting the shipped file.
          cat > /etc/portage/binrepos.conf/gentoo.conf << 'BINHOST'
          [gentoo]
          priority = 0
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
          location = /var/cache/binhost/gentoo-official-v3
          verify-signature = true
          BINHOST

          mkdir -p /etc/portage/package.accept_keywords
          echo '*/*::gentoo-nexus **' > /etc/portage/package.accept_keywords/nexus
          echo 'net-libs/webkit-gtk -~amd64 amd64' > /etc/portage/package.accept_keywords/stable-binary

          mkdir -p /etc/portage/package.use
          cat > /etc/portage/package.use/nexus << 'USES'
          media-libs/opus abi_x86_64
          gui-libs/gtk introspection
          sys-auth/seatd server
          sys-kernel/installkernel dracut grub
          sys-kernel/linux-firmware redistributable initramfs
          sys-libs/minizip-ng compat
          sys-apps/dbus -systemd elogind
          media-video/pipewire -systemd elogind -ffmpeg
          dev-libs/libdbusmenu gtk3
          net-misc/networkmanager bluetooth modemmanager
          sys-libs/ncurses gpm
          sys-libs/zlib-ng abi_x86_32 abi_x86_64 compat
          x11-libs/libdrm video_cards_amdgpu video_cards_radeon
          media-libs/mesa -rust -opencl proprietary-codecs
          media-video/ffmpeg x264 x265 vpx opus dav1d vaapi vdpau
          */* VIDEO_CARDS: -* amdgpu radeonsi
          USES

          cat > /etc/portage/package.use/gaming << 'GAMING'
          app-accessibility/at-spi2-core abi_x86_32
          app-arch/brotli abi_x86_32
          app-arch/bzip2 abi_x86_32
          app-arch/lz4 abi_x86_32
          app-arch/xz-utils abi_x86_32
          app-arch/zstd abi_x86_32
          app-crypt/p11-kit abi_x86_32
          dev-db/sqlite abi_x86_32
          dev-lang/rust abi_x86_32
          dev-lang/rust-bin abi_x86_32
          dev-libs/dbus-glib abi_x86_32
          dev-libs/elfutils abi_x86_32
          dev-libs/expat abi_x86_32
          dev-libs/fribidi abi_x86_32
          dev-libs/glib abi_x86_32
          dev-libs/gmp abi_x86_32
          dev-libs/icu abi_x86_32
          dev-libs/json-glib abi_x86_32
          dev-libs/leancrypto abi_x86_32
          dev-libs/libevdev abi_x86_32
          dev-libs/libffi abi_x86_32
          dev-libs/libgcrypt abi_x86_32
          dev-libs/libgpg-error abi_x86_32
          dev-libs/libgudev abi_x86_32
          dev-libs/libgusb abi_x86_32
          dev-libs/libpcre2 abi_x86_32
          dev-libs/libtasn1 abi_x86_32
          dev-libs/libunistring abi_x86_32
          dev-libs/libusb abi_x86_32
          dev-libs/libxml2 abi_x86_32
          dev-libs/lzo abi_x86_32
          dev-libs/nettle abi_x86_32
          dev-libs/nspr abi_x86_32
          dev-libs/nss abi_x86_32
          dev-libs/openssl abi_x86_32
          dev-libs/wayland abi_x86_32
          dev-util/glslang abi_x86_32
          dev-util/spirv-tools abi_x86_32
          dev-util/sysprof-capture abi_x86_32
          dev-util/vulkan-utility-libraries abi_x86_32
          gnome-base/librsvg abi_x86_32
          gui-libs/libdecor abi_x86_32
          llvm-core/clang abi_x86_32
          llvm-core/llvm abi_x86_32 -xml
          llvm-runtimes/compiler-rt abi_x86_32
          media-gfx/graphite2 abi_x86_32
          media-libs/alsa-lib abi_x86_32
          media-libs/flac abi_x86_32
          media-libs/fontconfig abi_x86_32
          media-libs/freetype brotli harfbuzz abi_x86_32
          media-libs/glu abi_x86_32
          media-libs/harfbuzz abi_x86_32
          media-libs/lcms abi_x86_32
          media-libs/libdisplay-info abi_x86_32
          media-libs/libepoxy abi_x86_32
          media-libs/libglvnd abi_x86_32 X
          media-libs/libjpeg-turbo abi_x86_32
          media-libs/libogg abi_x86_32
          media-libs/libpng abi_x86_32
          media-libs/libpulse abi_x86_32
          media-libs/libsdl2 abi_x86_32
          media-libs/libsdl3 abi_x86_32
          media-libs/libsndfile abi_x86_32
          media-libs/libva abi_x86_32
          media-libs/libvorbis abi_x86_32
          media-libs/libwebp abi_x86_32
          media-libs/mesa abi_x86_32
          media-libs/openal abi_x86_32
          media-libs/opus abi_x86_32
          media-libs/tiff abi_x86_32
          media-libs/vulkan-layers abi_x86_32
          media-libs/vulkan-loader abi_x86_32 layers
          media-sound/lame abi_x86_32
          media-sound/mpg123-base abi_x86_32
          media-video/pipewire abi_x86_32
          net-dns/c-ares abi_x86_32
          net-dns/libidn2 abi_x86_32
          net-libs/gnutls abi_x86_32
          net-libs/libasyncns abi_x86_32
          net-libs/libndp abi_x86_32
          net-libs/libpsl abi_x86_32
          net-libs/nghttp2 abi_x86_32
          net-libs/nghttp3 abi_x86_32
          net-libs/ngtcp2 abi_x86_32
          net-misc/curl abi_x86_32
          net-misc/networkmanager abi_x86_32
          net-print/cups abi_x86_32
          sys-apps/dbus abi_x86_32
          sys-apps/lm-sensors abi_x86_32
          sys-apps/systemd-utils abi_x86_32
          sys-apps/util-linux abi_x86_32
          sys-libs/gdbm abi_x86_32
          sys-libs/glibc hash-sysv-compat
          sys-libs/gpm abi_x86_32
          sys-libs/libcap abi_x86_32
          sys-libs/libudev-compat abi_x86_32
          sys-libs/ncurses abi_x86_32
          sys-libs/pam abi_x86_32
          sys-libs/readline abi_x86_32
          sys-libs/zlib abi_x86_32
          virtual/glu abi_x86_32
          virtual/libelf abi_x86_32
          virtual/libiconv abi_x86_32
          virtual/libintl abi_x86_32
          virtual/libudev abi_x86_32
          virtual/libusb abi_x86_32
          virtual/opengl abi_x86_32
          virtual/zlib abi_x86_32
          x11-libs/cairo abi_x86_32
          x11-libs/gdk-pixbuf abi_x86_32
          x11-libs/gtk+ abi_x86_32
          x11-libs/libICE abi_x86_32
          x11-libs/libSM abi_x86_32
          x11-libs/libX11 abi_x86_32
          x11-libs/libXScrnSaver abi_x86_32
          x11-libs/libXau abi_x86_32
          x11-libs/libXcomposite abi_x86_32
          x11-libs/libXcursor abi_x86_32
          x11-libs/libXdamage abi_x86_32
          x11-libs/libXdmcp abi_x86_32
          x11-libs/libXext abi_x86_32
          x11-libs/libXfixes abi_x86_32
          x11-libs/libXft abi_x86_32
          x11-libs/libXi abi_x86_32
          x11-libs/libXinerama abi_x86_32
          x11-libs/libXrandr abi_x86_32
          x11-libs/libXrender abi_x86_32
          x11-libs/libXtst abi_x86_32
          x11-libs/libXxf86vm abi_x86_32
          x11-libs/libdrm abi_x86_32
          x11-libs/libpciaccess abi_x86_32
          x11-libs/libvdpau abi_x86_32
          x11-libs/libxcb abi_x86_32
          x11-libs/libxkbcommon abi_x86_32
          x11-libs/libxshmfence abi_x86_32
          x11-libs/pango abi_x86_32
          x11-libs/pixman abi_x86_32
          x11-libs/xcb-util-keysyms abi_x86_32
          x11-misc/colord abi_x86_32
          GAMING

          mkdir -p /etc/portage/package.mask
          echo '>=dev-libs/libgit2-1.9.3' > /etc/portage/package.mask/libgit2

          emaint binhost --fix

          while IFS= read -r -d '' ebuild_file; do
              ebuild "$ebuild_file" manifest >/dev/null 2>&1 || true
          done < <(find /var/db/repos/gentoo-nexus -mindepth 2 -maxdepth 3 -name "*.ebuild" -print0)

          TARGET="$RAW_TARGET"
          if [[ "$TARGET" != =* && "$TARGET" != *"-9999" ]]; then
            RESOLVED=$(portageq best_visible / "$TARGET" 2>/dev/null || true)
            if [ -n "$RESOLVED" ] && [[ "$RESOLVED" == */* ]]; then
              TARGET="=${RESOLVED}"
            fi
          fi

          emerge --oneshot --getbinpkg --backtrack=30 --quiet-build=y '>=dev-libs/gobject-introspection-1.86.0' 2>/dev/null || true

          # Pre-build sysprof-capture with abi_x86_32 before any target that
          # might transitively pull in glib (e.g. via gdbus-codegen).
          # Must run BEFORE gdbus-codegen emerge — otherwise the official
          # binhost's binary (without abi_x86_32) gets cached and the rebuild
          # attempt fails.  The local binrepo (priority 15) ensures the
          # pre-built package is found by --getbinpkg before remote repos.
          echo ">>> Pre-building sysprof-capture with abi_x86_32..."
          emerge --oneshot --buildpkg --getbinpkg=n --usepkg=n \
              --backtrack=30 --quiet-build=y \
              "dev-util/sysprof-capture" 2>/dev/null || true
          rm -f /var/cache/binpkgs/Packages /var/cache/binpkgs/Packages.gz
          emaint binhost --fix

          emerge --oneshot --getbinpkg --backtrack=30 --quiet-build=y '>=dev-util/gdbus-codegen-2.88.1' 2>/dev/null || true

          if echo "${TARGET}" | grep -qE "media-libs/mesa|media-libs/libsdl2|media-video/ffmpeg|media-video/pipewire|x11-libs/gtk|gui-libs/libdecor|gui-wm/"; then
              emerge --oneshot --getbinpkg --backtrack=30 --quiet-build=y "dev-libs/wayland" "dev-util/wayland-scanner" 2>/dev/null || {
                  emerge --oneshot --usepkg --getbinpkg --buildpkg --backtrack=30 --quiet-build=y "dev-libs/wayland" "dev-util/wayland-scanner" || true
              }
          fi

          # Pre-build xbitmaps from source (binary from official binhost can
          # spuriously fail, cascading to drop xorg-server and drivers).
          # Always run because transitive deps (e.g. media-gfx/blender-bin
          # pulling xorg-server) are not caught by a TARGET-based grep.
          emerge --oneshot --buildpkg --getbinpkg=n --usepkg=n \
              --backtrack=30 --quiet-build=y \
              "x11-misc/xbitmaps" 2>/dev/null || true

          set +e
          touch /var/cache/binpkgs/.build_start

          # Self-heal perl slot bumps: the restored release binaries can carry a
          # stale perl (e.g. 5.42) while ::gentoo has moved on (5.44), leaving
          # installed perl-modules invalid and producing slot conflicts that block
          # the target build. When the tree's perl differs from the restored one,
          # upgrade perl and rebuild every perl-dependent module. This runs after
          # the .build_start marker so the produced binaries reach the rolling
          # release and the environment heals itself.
          BEST_PERL=$(portageq best_visible / 'dev-lang/perl' 2>/dev/null || true)
          INSTALLED_PERL=$(portageq best_version / 'dev-lang/perl' 2>/dev/null || true)
          if [ -n "$BEST_PERL" ] && [ -n "$INSTALLED_PERL" ] && [ "$BEST_PERL" != "$INSTALLED_PERL" ]; then
            echo ">>> Perl outdated: ${INSTALLED_PERL} -> ${BEST_PERL}; upgrading perl stack..."
            emerge --oneshot --getbinpkg --buildpkg --backtrack=30 --quiet-build=y "=${BEST_PERL}" 2>&1 | tail -5 || true
            if ! command -v perl-cleaner >/dev/null 2>&1; then
              emerge --oneshot --getbinpkg --buildpkg --backtrack=30 --quiet-build=y app-admin/perl-cleaner 2>&1 | tail -3 || true
            fi
            perl-cleaner --all 2>&1 | tail -15 || true
            rm -f /var/cache/binpkgs/Packages /var/cache/binpkgs/Packages.gz
            emaint binhost --fix
            echo ">>> Perl stack rebuilt."
          else
            echo ">>> Perl stack is current (${INSTALLED_PERL:-none})."
          fi

          # Self-heal the gpm/ncurses circular dependency. The desktop profile
          # enables gpm globally, so the consumer's ncurses carries gpm; if the
          # restored nexus ncurses binary lacks it (stale build), the binary is
          # rejected and Portage tries a source rebuild of ncurses+gpm, which
          # deadlocks: ncurses(gpm) needs gpm headers at buildtime and gpm needs
          # ncurses at buildtime. Bootstrap in dependency order so both land in
          # the local binrepo with correct USE: ncurses -gpm (binary) -> gpm
          # (binary) -> ncurses +gpm (source rebuild, --buildpkg).
          HEAL_NCURSES="false"
          INSTALLED_NCURSES=$(portageq best_version / 'sys-libs/ncurses' 2>/dev/null || true)
          if [ -n "$INSTALLED_NCURSES" ] && \
             { ! grep -q 'gpm' "/var/db/pkg/${INSTALLED_NCURSES}/USE" 2>/dev/null || \
               ! grep -q 'abi_x86_32' "/var/db/pkg/${INSTALLED_NCURSES}/USE" 2>/dev/null; }; then
            HEAL_NCURSES="true"
            echo ">>> gpm/ncurses heal: installed ncurses (${INSTALLED_NCURSES}) lacks gpm or abi_x86_32"
          fi
          if [ "$HEAL_NCURSES" == "true" ]; then
            echo ">>> Bootstrapping ncurses/gpm: ncurses -gpm -> gpm -> ncurses +gpm"
            sed -i '/^sys-libs\/ncurses gpm$/d' /etc/portage/package.use/nexus
            echo 'sys-libs/ncurses -gpm' >> /etc/portage/package.use/nexus
            emerge --oneshot --getbinpkg --backtrack=30 --quiet-build=y --autounmask=n \
              sys-libs/ncurses 2>&1 | tail -5 || true
            emerge --oneshot --getbinpkg --buildpkg --backtrack=30 --quiet-build=y --autounmask=n \
              sys-libs/gpm 2>&1 | tail -5 || true
            sed -i '/^sys-libs\/ncurses -gpm$/d' /etc/portage/package.use/nexus
            echo 'sys-libs/ncurses gpm' >> /etc/portage/package.use/nexus
            emerge --oneshot --getbinpkg --buildpkg --usepkg-exclude sys-libs/ncurses \
              --backtrack=30 --quiet-build=y --autounmask=n \
              sys-libs/ncurses 2>&1 | tail -5 || true
            rm -f /var/cache/binpkgs/Packages /var/cache/binpkgs/Packages.gz
            emaint binhost --fix
            echo ">>> gpm/ncurses heal complete."
          fi

          FORCE_MATCH="false"
          if [[ "$FORCE" == "true" ]]; then
            FORCE_MATCH="true"
          else
            for fatom in $FORCE; do
              fatom="${fatom#=}"
              if [[ "${TARGET#=}" == "$fatom"* ]]; then
                FORCE_MATCH="true"
                break
              fi
            done
          fi

          CPV="${TARGET#=}"
          PN=$(echo "$CPV" | sed -E 's/-[0-9].*//')
          if [[ "$FORCE_MATCH" == "true" ]]; then
            # Force rebuild: build the TARGET from SOURCE so new flags (e.g.
            # VIDEO_CARDS) take effect, while dependencies are still fetched as
            # binaries via --getbinpkg. --usepkg-exclude takes a package NAME
            # (not a versioned atom) and stops Portage reusing the target binary.
            echo ">>> FORCE REBUILD: compiling ${TARGET} from source (deps from binpkg)"
            emerge --oneshot --getbinpkg --buildpkg --usepkg-exclude "$PN" \
              --binpkg-respect-use=y --quiet-build=y --keep-going \
              --autounmask=n \
              "${TARGET}" 2>&1 | tee /tmp/emerge.log
            BUILD_EXIT=${PIPESTATUS[0]}
          else
            emerge --oneshot --usepkg --getbinpkg --buildpkg --backtrack=30 \
              --binpkg-respect-use=y --quiet-build=y --keep-going \
              --autounmask=n \
              "${TARGET}" 2>&1 | tee /tmp/emerge.log
            BUILD_EXIT=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ">>> BUILD FAILED with exit code $BUILD_EXIT"
            echo ">>> WARNING: emerge failed for ${TARGET}. Check logs above."
          fi

          # Force a FULL re-scan of the binary package directory. With the
          # pkgdir-index-trusted FEATURE (set in the profile), emaint otherwise
          # trusts the downloaded Packages index and silently drops any CPV
          # whose .gpkg.tar is present but not already indexed -- causing the
          # reconcile step to re-add the same "missing" entries every run.
          rm -f /var/cache/binpkgs/Packages /var/cache/binpkgs/Packages.gz
          emaint binhost --fix
          [ "$BUILD_EXIT" -eq 0 ] || exit $BUILD_EXIT
          BUILDSCRIPT

          chmod +x build.sh
          echo "TARGET=${{ steps.queue.outputs.TARGET_PKG }}" >> "$GITHUB_ENV"
          echo "FORCE_REBUILD=${{ github.event.inputs.force_rebuild }}" >> "$GITHUB_ENV"

      # ---- topic: docker-build ----
      - name: Build Package in Docker
        if: steps.queue.outputs.skip_compile != 'true'
        run: |
          touch build_start_marker
          docker run --rm --privileged \
            -v "${{ github.workspace }}/binpkgs:/var/cache/binpkgs:rw" \
            -v "${{ github.workspace }}/overlay:/var/db/repos/gentoo-nexus:rw" \
            -v "${{ github.workspace }}/distfiles:/var/cache/distfiles:rw" \
            -v "${{ github.workspace }}/ccache:/var/cache/ccache:rw" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            gentoo/stage3:amd64-desktop-openrc \
            bash /build.sh "${{ env.TARGET }}" "${{ env.FORCE_REBUILD }}"

      - name: Fix Permissions Post-Build
        if: steps.queue.outputs.skip_compile != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Reconcile Packages Index
        if: ${{ always() && steps.queue.outputs.skip_compile != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet zstandard 2>/dev/null || true
          python3 << 'PYEOF'
          # Regenerate the complete Packages index from scratch. Every .gpkg.tar
          # file on disk contributes one entry with metadata read from the gpkg
          # itself (GLEP 78). This is purely deterministic -- same files produce
          # the same index, making a second run a no-op.
          #
          # Two safety filters keep the index aligned with what the upload step
          # actually publishes to the rolling release:
          #  1. Pre-build artifacts (portage/ccache/sysprof-capture/etc. built
          #     BEFORE the .build_start marker) are never uploaded, so they are
          #     dropped here unless they already exist in the release. Without
          #     this they would become dangling index entries.
          #  2. When several build-ids of the same CPV are on disk (restored old
          #     build + freshly built one), only the newest build-id is indexed,
          #     because the upload step deletes the older assets by PN.
          import os, re, io, time, tarfile, subprocess

          try:
              import zstandard
              HAVE_ZSTD = True
          except ImportError:
              HAVE_ZSTD = False

          pkgdir = 'binpkgs'
          packages_file = os.path.join(pkgdir, 'Packages')

          release_assets = set()
          try:
              out = subprocess.check_output(
                  ['gh', 'release', 'view', 'rolling', '--json', 'assets',
                   '--jq', '.assets[].name'],
                  stderr=subprocess.DEVNULL, timeout=120)
              release_assets = {l for l in out.decode().splitlines() if l}
          except Exception:
              pass
          # Fallback: if gh is unavailable, trust the downloaded index's CPVs.
          if not release_assets:
              try:
                  for _l in open('/tmp/rl-Packages'):
                      _l = _l.strip()
                      if _l.startswith('CPV: '):
                          release_assets.add(_l[5:])
              except Exception:
                  pass

          marker = os.path.join(pkgdir, '.build_start')
          try:
              marker_mtime = os.path.getmtime(marker)
          except Exception:
              marker_mtime = 0

          def _decompress(data):
              if HAVE_ZSTD:
                  return zstandard.ZstdDecompressor().decompressobj().decompress(data)
              tf = '/tmp/meta.zst'
              with open(tf, 'wb') as o:
                  o.write(data)
              raw = subprocess.check_output(['zstd', '-d', '-c', tf])
              os.unlink(tf)
              return raw

          def read_gpkg_metadata(gpkg_path):
              try:
                  with open(gpkg_path, 'rb') as fh:
                      with tarfile.open(fileobj=fh, mode='r|') as tar:
                          for m in tar:
                              if m.name.endswith(('.tar.zst', '.tar.gz', '.tar.bz2')):
                                  if 'metadata' not in m.name:
                                      continue
                                  raw = _decompress(tar.extractfile(m).read())
                                  meta = {}
                                  with tarfile.open(fileobj=io.BytesIO(raw)) as mt:
                                      for mm in mt.getmembers():
                                          if mm.name.startswith('metadata/') and not mm.isdir():
                                              name = mm.name.split('/', 1)[1]
                                              meta[name] = mt.extractfile(mm).read().decode('utf-8', 'replace').strip()
                                  return meta
              except Exception as e:
                  print(f"  WARN: cannot read metadata from {gpkg_path}: {e}")
              return {}

          META_KEYS = ('BUILD_ID', 'BUILD_TIME', 'USE', 'CHOST', 'CBUILD',
                       'CFLAGS', 'CXXFLAGS', 'LDFLAGS', 'FEATURES', 'LICENSE',
                       'KEYWORDS', 'REQUIRED_USE', 'PROPERTIES', 'RESTRICT',
                       'DEFINED_PHASES', 'IUSE', 'SLOT', 'EAPI', 'REPO_REVISIONS',
                       'DEPEND', 'RDEPEND', 'PDEPEND', 'IDEPEND',
                       'SIZE', 'MD5', 'SHA1', 'SHA512')

          def _bid_key(meta, f):
              bid = meta.get('BUILD_ID', '')
              if not bid:
                  bid = re.sub(r'-\d+$', '', f[:-9])
                  m2 = re.search(r'-(\d+)$', bid)
                  bid = m2.group(1) if m2 else '0'
              try:
                  return int(bid)
              except Exception:
                  return 0

          # Package names that will be (re)built this run. The upload step deletes
          # every existing asset of that package name when publishing the new build,
          # so restored assets under those names must be dropped from the index.
          new_pns = set()
          for root, _dirs, files in os.walk(pkgdir):
              for f in files:
                  if not f.endswith('.gpkg.tar'):
                      continue
                  try:
                      if os.path.getmtime(os.path.join(root, f)) > marker_mtime:
                          new_pns.add(re.sub(r'-\d+$', '', f[:-9]))
                  except Exception:
                      pass

          entries = []
          for root, _dirs, files in os.walk(pkgdir):
              for f in files:
                  if not f.endswith('.gpkg.tar'):
                      continue
                  fullpath = os.path.join(root, f)
                  relpath = os.path.relpath(fullpath, pkgdir).replace('\\', '/')

                  meta = read_gpkg_metadata(fullpath)
                  cpv = meta.get('CPV')
                  if not cpv:
                      base = re.sub(r'-\d+$', '', f[:-9])
                      m = re.match(r'^(.+?)-(\d[\w.*+-]*(?:-r\d+)?)$', base)
                      if not m:
                          print(f"  SKIP (unparseable): {relpath}")
                          continue
                      cat = meta.get('CATEGORY')
                      if not cat:
                          print(f"  SKIP (no category): {relpath}")
                          continue
                      cpv = f"{cat}/{base}"

                  try:
                      mtime = os.path.getmtime(fullpath)
                  except Exception:
                      mtime = 0
                  base = os.path.basename(relpath)
                  pn = re.sub(r'-\d+$', '', f[:-9])
                  # A file is indexed only if it will exist in the release after
                  # this run's upload: either it is freshly built (uploaded now),
                  # or it is already published and no new build of the same package
                  # name will replace it. Everything else is dropped so the index
                  # never points at an asset that is missing or about to be deleted.
                  if mtime > marker_mtime:
                      pass
                  elif base in release_assets and pn not in new_pns:
                      pass
                  else:
                      print(f"  SKIP (not published after upload): {relpath}")
                      continue

                  block = {'CPV': cpv, 'PATH': relpath, 'URI': base}
                  # SIZE must be the actual on-disk file size (portage verifies
                  # downloads against it). The gpkg metadata SIZE is the
                  # uncompressed size and causes digest verification failures.
                  block['SIZE'] = str(os.path.getsize(fullpath))
                  # MTIME is required by download_required()/remote sync; it is
                  # compared against the cached file's mtime to decide whether
                  # to re-download. Without it portage crashes with KeyError.
                  block['MTIME'] = str(int(mtime))
                  for k in META_KEYS:
                      if k in meta and k != 'SIZE':
                          block[k] = meta[k]
                  bid = _bid_key(meta, f)
                  if 'BUILD_ID' not in block and bid:
                      block['BUILD_ID'] = str(bid)
                  if 'BUILD_TIME' not in block:
                      try:
                          block['BUILD_TIME'] = str(int(mtime))
                      except Exception:
                          pass
                  entries.append(block)

          # Deduplicate by CPV: when several build-ids of the same CPV exist on
          # disk (restored old build + freshly built one, or packages restored
          # from the release into different directories), keep only the entry
          # with the newest BUILD_ID so the index never advertises two
          # conflicting metadata blocks for one CPV.
          by_cpv = {}
          for b in entries:
              cur = by_cpv.get(b['CPV'])
              if cur is None:
                  by_cpv[b['CPV']] = b
                  continue
              cur_bid = int(cur.get('BUILD_ID', '0') or 0)
              new_bid = int(b.get('BUILD_ID', '0') or 0)
              if new_bid > cur_bid:
                  by_cpv[b['CPV']] = b
          entries = sorted(by_cpv.values(), key=lambda b: b['CPV'])

           # Portage's PackageIndex.readHeader only understands 'Key: value'
          # pairs. A bare "'file' 'ARCH' 'N'" line yields an empty header and
          # remote binrepo sync is rejected (VERSION=None). Write a proper
          # header with VERSION/TIMESTAMP/PACKAGES so --getbinpkg consumers
          # (see machine/binrepos.conf) can fetch from the release.
          with open(packages_file, 'w') as pkgs:
              pkgs.write(f"PACKAGES: {len(entries)}\n")
              pkgs.write(f"TIMESTAMP: {int(time.time())}\n")
              pkgs.write(f"VERSION: 0\n")
              pkgs.write("CHOST: x86_64-pc-linux-gnu\n")
              pkgs.write('\n')
              for block in entries:
                  for k, v in block.items():
                      pkgs.write(f"{k}: {v}\n")
                  pkgs.write('\n')

          print(f">>> Reconciled Packages index: {len(entries)} entries")
          PYEOF

      # ---- topic: validate-and-upload ----
      - name: Validate Binary Packages Before Upload
        if: ${{ always() && steps.queue.outputs.skip_compile != 'true' }}
        run: |
          echo ">>> Validating .gpkg.tar files before upload..."
          CORRUPT=0
          for f in $(find binpkgs -name '*.gpkg.tar' -type f); do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 1000 ]; then
              echo "  CORRUPT (too small: ${size}B): $f"
              rm -f "$f"
              CORRUPT=$((CORRUPT + 1))
              continue
            fi
            if ! tar -tf "$f" >/dev/null 2>&1; then
              echo "  CORRUPT (invalid tar): $f"
              rm -f "$f"
              CORRUPT=$((CORRUPT + 1))
              continue
            fi
            echo "  OK (${size}B): $f"
          done
          if [ "$CORRUPT" -gt 0 ]; then
            echo ">>> WARNING: Removed $CORRUPT corrupt package(s). Rerun reconcile to update Packages."
          else
            echo ">>> All packages valid."
          fi

      - name: Upload to GitHub Release
        if: ${{ always() && steps.queue.outputs.skip_compile != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo ">>> Ensuring rolling release exists..."
          if ! gh release view rolling --repo "$REPO" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release create rolling \
                --repo "$REPO" \
                --title "Nexus Rolling Binaries" \
                --prerelease 2>&1 && break
              sleep 5
            done
          fi

          retry_upload() {
            for i in 1 2 3; do
              # --clobber replaces an existing asset with the same name, so the
              # Packages index is always refreshed even if the delete step missed.
              gh release upload rolling --clobber "$1" --repo "$REPO" 2>&1 && return 0
              sleep 5
            done
            return 1
          }

          # Determine which reference file to use for -newer
          if [ -f binpkgs/.build_start ]; then
            REF_FILE="binpkgs/.build_start"
          else
            REF_FILE="build_start_marker"
          fi
          echo ">>> Using reference file: $REF_FILE"

          UPLOAD_FAILED=0

          # 1. Upload newly built .gpkg.tar files first (before Packages index)
          echo ">>> Uploading new binary packages..."
          shopt -s nullglob
          while IFS= read -r -d '' file; do
            ASSET_NAME=$(basename "$file")
            # gpkg layout is binpkgs/gpkg/<arch>/<cat>/<pn>/<pf>-<buildid>.gpkg.tar,
            # so the package name is derived from the filename, never from path
            # fields (awk -F/ '{print $3}' yields the arch). Strip the trailing
            # -<buildid> suffix to get <pf> (e.g. highway-1.4.0-2 -> highway-1.4.0).
            PN=$(echo "$ASSET_NAME" | sed -E 's/\.gpkg\.tar$//; s/-[0-9]+$//')
            echo "  Processing: $ASSET_NAME (PN=$PN)"

            # Delete old versions of the same package name
            for old_asset in $(gh release view rolling --json assets --jq '.assets[].name' --repo "$REPO" 2>/dev/null); do
              if [[ "$old_asset" == ${PN}-[0-9]*.gpkg.tar ]]; then
                echo "    Deleting old version: $old_asset"
                gh release delete-asset rolling "$old_asset" --repo "$REPO" -y 2>&1 || true
              fi
            done

            if retry_upload "$file"; then
              echo "    OK: $ASSET_NAME uploaded"
            else
              echo "    ERROR: Failed to upload $ASSET_NAME after 3 retries" >&2
              UPLOAD_FAILED=1
            fi
          done < <(find binpkgs -type f -name '*.gpkg.tar' -newer "$REF_FILE" -print0 2>/dev/null)

          # 2. Sanitize and upload Packages index last (the "commit" step)
          echo ">>> Processing Packages index..."
          for existing in Packages Packages.gz; do
            if gh release view rolling --json assets --jq '.assets[].name' --repo "$REPO" 2>/dev/null | grep -qxF "$existing"; then
              echo "  Deleting existing: $existing"
              gh release delete-asset rolling "$existing" --repo "$REPO" -y 2>&1 || true
            fi
          done
          sed -i -E \
            -e 's|^PATH: .*/([^/]+\.gpkg\.tar)$|PATH: \1|' \
            -e 's|^URI: .*/([^/]+\.gpkg\.tar)$|URI: \1|' \
            binpkgs/Packages 2>/dev/null || true

          awk '/^CPV: acct-(group|user)\//{skip=1} /^$/{if(skip){skip=0; next}} !skip' \
            binpkgs/Packages > binpkgs/Packages.tmp && mv binpkgs/Packages.tmp binpkgs/Packages 2>/dev/null || true

          rm -f binpkgs/Packages.gz
          gzip -c binpkgs/Packages 2>/dev/null > binpkgs/Packages.gz || true

          for file in binpkgs/Packages*; do
            [ -f "$file" ] || continue
            BN=$(basename "$file")
            echo "  Uploading: $BN"
            if retry_upload "$file"; then
              echo "    OK: $BN uploaded"
            else
              echo "    ERROR: Failed to upload $BN after 3 retries" >&2
              UPLOAD_FAILED=1
            fi
          done

          if [ "$UPLOAD_FAILED" -ne 0 ]; then
            echo ">>> WARNING: One or more uploads failed. The rolling release may be incomplete."
            echo ">>> Check the above logs for details."
          else
            echo ">>> All uploads completed successfully."
          fi

          # === Update commit manifest for 9999 live packages ===
          COMMITS_JSON=$(gh release download rolling -p 'commits.json' --repo "$REPO" --clobber -O /tmp/commits.json 2>/dev/null && cat /tmp/commits.json || echo '{}')
          while IFS= read -r -d '' file; do
            CAT=$(echo "$file" | awk -F'/' '{print $2}')
            PN=$(echo "$file" | awk -F'/' '{print $3}')
            ATOM="${CAT}/${PN}"
            EBUILD="overlay/${CAT}/${PN}/${PN}-9999.ebuild"
            if [ -f "$EBUILD" ]; then
              EGIT_COMMIT=$(grep -oP '^EGIT_COMMIT="\K[a-fA-F0-9]+' "$EBUILD" 2>/dev/null || true)
              if [ -n "$EGIT_COMMIT" ]; then
                COMMITS_JSON=$(echo "$COMMITS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); d['${ATOM}']='${EGIT_COMMIT}'; print(json.dumps(d,indent=2))")
                echo "  [*] Recorded commit ${EGIT_COMMIT} for ${ATOM}"
              fi
            fi
          done < <(find binpkgs -type f -name '*.gpkg.tar' -newer "$REF_FILE" -print0 2>/dev/null)
          echo "$COMMITS_JSON" > /tmp/commits.json
          for i in 1 2 3; do
            gh release upload rolling /tmp/commits.json --repo "$REPO" --clobber 2>&1 && { echo ">>> commits.json updated"; break; }
            sleep 3
          done

  # ---- topic: relay ----
  relay:
    if: ${{ always() && needs.build.outputs.remaining != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          echo ">>> Triggering relay for: ${{ needs.build.outputs.remaining }}"
          for i in 1 2 3; do
            gh workflow run "${{ github.workflow }}" \
              --ref "${{ github.ref_name }}" \
              --repo ${{ github.repository }} \
              -f package_list="${{ needs.build.outputs.remaining }}" \
              -f force_rebuild="${{ needs.build.outputs.force_rebuild }}" && exit 0
            sleep 10
          done
          exit 1
